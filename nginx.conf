server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Duplicate URLs: the .html forms are the same bytes as the clean paths,
    # so redirect rather than serve them twice.
    location = /index.html { return 301 /; }
    location = /terms.html { return 301 /terms; }
    location = /privacy.html { return 301 /privacy; }
    location = /refund.html { return 301 /refund; }
    location = /whatsapp-api.html { return 301 /whatsapp-api; }
    location = /en/index.html { return 301 /; }
    location = /en/terms.html { return 301 /en/terms; }
    location = /en/privacy.html { return 301 /en/privacy; }
    location = /en/refund.html { return 301 /en/refund; }
    location = /en/whatsapp-api.html { return 301 /en/whatsapp-api; }

    # Legal pages: explicit paths so both /terms and /terms.html work
    location = /terms {
        default_type text/html;
        try_files /terms.html =404;
    }
    location = /privacy {
        default_type text/html;
        try_files /privacy.html =404;
    }
    location = /refund {
        default_type text/html;
        try_files /refund.html =404;
    }
    location = /whatsapp-api {
        default_type text/html;
        try_files /whatsapp-api.html =404;
    }
    location = /en/ {
        return 301 /;
    }
    location = /en/whatsapp-api {
        default_type text/html;
        try_files /en/whatsapp-api.html =404;
    }
    location /en/ {
        try_files $uri $uri.html $uri/ =404;
    }

    # SEO files need their own content types; the HTML catch-all would
    # otherwise serve the page as robots.txt (a soft 404 Google reads as
    # "no rules" and Lighthouse reads as "robots.txt is not valid").
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /favicon.ico {
        default_type image/x-icon;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # a missing asset must 404, not silently return the page as HTML
    location ~* \.(mp4|webm|jpg|jpeg|png|svg|ico|css|js|woff2|txt|xml|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
    # fonts and icons never change under the same name (^~ beats the regex above)
    location ^~ /assets/fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Only the real entry points serve index.html: an unknown path is a 404,
    # not a 200 copy of the homepage (a soft-404 Google penalises).
    location = / {
        try_files /index.html =404;
    }
    location / {
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/html text/css application/javascript application/json application/xml image/svg+xml text/plain;
}
